services:
  app:
    build: .
    environment:
      MCP_URL: http://jira-mcp:8081/mcp
      MCP_AUTH_TOKEN: ${MCP_INTERNAL_AUTH_TOKEN:?Internal MCP token is missing. Start TeamWork with ./start.sh}
      JIRA_MCP_BASE_URL: http://jira-mcp:8081
      CONFIG_PATH: /app/config/grouping.config.json
      DATA_DIR: /app/data
      LOG_PATH: /app/data/app.log
      COMMENTS_PATH: /app/data/comments.json
      LABELS_PATH: /app/data/labels.json
      WORKSPACE_PATH: /app/data/workspace.json
      LLM_SECRET_DIR: /var/lib/teamwork-llm
      APP_AUTH_USER: ${APP_AUTH_USER:-admin}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:-}
      PORT: 8080
    volumes:
      - ./grouping.config.json:/app/config/grouping.config.json
      - ./data:/app/data
      - llm-secrets:/var/lib/teamwork-llm
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      jira-mcp:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  jira-mcp:
    build:
      context: ./mcp
    environment:
      PORT: 8081
      MCP_AUTH_TOKEN: ${MCP_INTERNAL_AUTH_TOKEN:?Internal MCP token is missing. Start TeamWork with ./start.sh}
      JIRA_TOKEN_ENCRYPTION_KEY: ${JIRA_TOKEN_ENCRYPTION_KEY:?Jira token encryption key is missing. Start TeamWork with ./start.sh}
      ATLASSIAN_REDIRECT_URI: ${ATLASSIAN_REDIRECT_URI:-http://localhost:8080/api/jira-auth/callback}
      ATLASSIAN_MCP_URL: https://mcp.atlassian.com/v1/mcp/authv2
      ALLOWED_ORIGINS: ${JIRA_MCP_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CREDENTIAL_STORE_PATH: /var/lib/teamwork/atlassian-oauth.enc
      ENCRYPTION_KEY_PATH: /var/lib/teamwork/encryption.key
    volumes:
      - jira-auth:/var/lib/teamwork
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  jira-auth:
  llm-secrets:
  ollama-data:
