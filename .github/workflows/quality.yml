name: Go quality and portable builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: core/go.sum
      - run: go test ./...
        working-directory: core
      - run: go vet ./...
        working-directory: core
      - run: go test ./...
        working-directory: sdk/go
      - run: go test ./...
        working-directory: modules/echo-go
      - run: go test ./...
        working-directory: modules/activity-go
      - run: go test ./...
        working-directory: modules/project-view-go
      - run: go test ./...
        working-directory: modules/jira-go
      - run: go test ./...
        working-directory: modules/slack-go
      - run: go test ./...
        working-directory: modules/onenote-go
      - run: go test ./...
        working-directory: modules/slack-onenote-go
      - run: ./scripts/release.sh
